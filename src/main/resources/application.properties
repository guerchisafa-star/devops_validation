#Donne un nom à ton projet Spring Boot
spring.application.name=sofrecom-qcm-backend

# Configuration base de données PostgreSQL
#Indique où se trouve la base de données
#localhost = sur ton PC
# 5432 = port PostgreSQL
#sofrecom_db = nom de la base
spring.datasource.url=jdbc:postgresql://localhost:5432/sofrecom_db
spring.datasource.username=postgres
spring.datasource.password=root123
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuration serveur
server.port=8082
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Configuration JWT
jwt.secret=sofrecomSecretKeyForJWTTokenGenerationAndValidation2024ThisIsAVeryLongSecretKeyThatShouldBeAtLeast256BitsLong
jwt.expiration=86400000

# Configuration CORS
cors.allowed-origins=http://localhost:4200,http://localhost:4201,http://localhost:3000

# Configuration des couleurs pour les logs
spring.output.ansi.enabled=always
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
